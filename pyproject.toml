[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emg-speech"
version = "1.0.0"
description = "Subvocal EMG speech recognition: acquisition, training and real-time inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyserial>=3.5",
    "torch>=2.1",
    "PyQt6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
emg-acquire = "apps.acquire:main"
emg-infer = "apps.infer:main"
emg-train = "apps.train:main"
emg-demo-data = "emg_speech.synthetic:main"
emg-simulate = "apps.simulate:main"

[tool.setuptools.packages.find]
include = ["emg_speech*", "ui*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
